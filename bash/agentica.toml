name = "bash"
# The oldest Agentica this package needs.
agentica = "0.35.0"

[style]
blank_line_after_end = true

# The module (native/bash.c) on vendored C, each folder with its LICENSE:
# - native/runtime: lib/src of tree-sitter v0.27.1 (MIT; unicode/ is ICU's) without wasm-stdlib, and
#   lib/include/tree_sitter/api.h; archive sha256 982cd3d4d9eb7be18c243240a622423fd2e4ecb4bec2cd98832c2f3fa1f0f333.
#   One change: the includes of unicode/*.h name their neighbours without `unicode/`, since the build has no -I.
# - native/grammar: src of tree-sitter-bash v0.25.1 (MIT), unchanged; archive sha256
#   2e785a761225b6c433410ef9c7b63cfb0a4e83a35a19e0f2aec140b42c06b52d. But parser.c (9.5 MB), over the 1 MiB of a file
#   of a fetched package: it includes src/parser.c of the submodule ../vendor/tree-sitter-bash (the same release).
# So only a git clone builds the module (`make install` fetches the submodule). A fetched `bash` never builds it from
# source: it uses the prebuilt library of its target in [native.bash.prebuilt] below (linux, macos and windows on x86_64,
# and linux and macos on arm64). A system with neither runs without the module: `Bash.parse` gives an error.
[native.bash]
build = { sources = ["native/bash.c", "native/runtime/lib.c", "native/grammar/parser.c", "native/grammar/scanner.c"], defines = ["_POSIX_C_SOURCE=200112L", "_DEFAULT_SOURCE", "_BSD_SOURCE", "_DARWIN_C_SOURCE", "TREE_SITTER_HIDE_SYMBOLS"] }
optional = true

# The libraries of the release bash-native-<source> (workflow bash-native.yml), one per target: a fetched `bash` uses the
# one of its target with no compiler. Other targets have no bash module. The rows change with the source key
# (`agentica native source bash`): a change in native/ or in `build` needs a new release and these rows.
[native.bash.prebuilt]
url = "https://github.com/agentica-lang/agc-agent/releases/download/bash-native-{source}/lib{name}-{api}-{target}{ext}"
source = "d63bc6fb66ee45a8"
api = "1.4"
sha256 = { linux-arm64 = "1d85276a96cd690c06126c20244c38786e23464481bab255e65d271c3ed548aa", linux-x86_64 = "451ac05e846af15183488dca0b7ea45b38c98847e9f96aad46841ac357d1a464", macos-arm64 = "6159a12b592eb1dc37ab40c90835d1759fced43f938df4366399b110ba5032bc", macos-x86_64 = "df6aad8e6ddfb7b7a8c3643b0f48f99669336d8198895b2fd0f27e9b6f27d561", windows-x86_64 = "a032763452ae2433c5616dce21ff3d821465e9b02b59a7ea06470fab9de0ad50" }
