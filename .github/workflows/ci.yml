name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  AGENTICA_VERSION: 0.32.0
  AGENTICA_SHA256: ec2a71e7c655e9c4a2f9e0c72ec6d3e661878ca561da4ce18ec84ae2c8d6ea95

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install the pinned Agentica release
        run: |
          archive="agentica-${AGENTICA_VERSION}-linux-x86_64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/agentica-lang/agentica/releases/download/${AGENTICA_VERSION}/$archive"
          echo "${AGENTICA_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/agentica-${AGENTICA_VERSION}-linux-x86_64/bin" >> "$GITHUB_PATH"

      - run: agentica --version

      # make check uses rg for the coupling rules of the packages.
      - run: command -v rg || { sudo apt-get update && sudo apt-get install -y ripgrep; }

      - run: make fmt-check

      # The coupling rules, then check, unit tests and a run of the entry point for every package.
      - run: make test

  # The llm tests against a real llama-server with Qwen2.5-0.5B on the runner's CPU. llama.cpp and the model are cached
  # by the hash of their fetch scripts, which check the sha256 of a download and skip one they already have.
  llama:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install the pinned Agentica release
        run: |
          archive="agentica-${AGENTICA_VERSION}-linux-x86_64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/agentica-lang/agentica/releases/download/${AGENTICA_VERSION}/$archive"
          echo "${AGENTICA_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/agentica-${AGENTICA_VERSION}-linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Cache llama.cpp
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .tools/llama.cpp
          key: llama-${{ hashFiles('scripts/fetch-llama.sh') }}

      - name: Cache the model
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .tools/models
          key: model-${{ hashFiles('scripts/fetch-model.sh') }}

      - run: make smoke-llama

      - name: llama-server log
        if: failure()
        run: cat llm/_build/llama-server.log || true
