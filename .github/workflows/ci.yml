name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # The jobs share the runners' CPUs with the llama job, whose tests have 30 s each: each job runs two things at once.
  JOBS: 2
  AGENTICA_VERSION: 0.32.0
  AGENTICA_SHA256: ec2a71e7c655e9c4a2f9e0c72ec6d3e661878ca561da4ce18ec84ae2c8d6ea95

jobs:
  # The targets of `make test`, one job each so that they run at once on the runners of the organization. A job installs
  # the pinned Agentica, and the packages that `make install` fetches are cached by their locks.
  test:
    name: ${{ matrix.name }}
    runs-on: [self-hosted, agentica-lang]
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: check core
            run: make fmt-check check PACKAGES=core
          - name: check packages
            run: make fmt-check check PACKAGES="sse llm mcp protocol monty shell client cli tui_client"
          - name: unit core
            run: make install unit PACKAGES=core
          - name: unit packages
            run: make install unit PACKAGES="sse llm mcp protocol monty shell client cli tui_client"
          - name: pty
            run: make pty
          - name: smoke and peer
            run: make smoke peer
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install the pinned Agentica release
        uses: agentica-lang/setup-agentica@v1
        with:
          version: ${{ env.AGENTICA_VERSION }}
          sha256: ${{ env.AGENTICA_SHA256 }}

      - name: Cache the fetched packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/agentica/pkg
          key: packages-${{ hashFiles('**/agentica.lock') }}

      # The compile cache of each package (_build/, 75 MB for core) is named by the hash of the sources, so a stale file
      # is never used; the last cache of the job and the Agentica version is the start of the next one.
      - name: Cache the compiled packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            */_build
            !*/_build/bin
          key: build-${{ env.AGENTICA_VERSION }}-${{ matrix.name }}-${{ hashFiles('**/*.agc', '!**/deps/**', '!**/_build/**') }}
          restore-keys: |
            build-${{ env.AGENTICA_VERSION }}-${{ matrix.name }}-

      - run: agentica --version

      # make check uses rg for the coupling rules of the packages.
      - run: command -v rg || { sudo apt-get update && sudo apt-get install -y ripgrep; }

      - run: ${{ matrix.run }}

  # The llm tests against a real llama-server with Qwen2.5-0.5B on the runner's CPU. llama.cpp and the model are cached
  # by the hash of their fetch scripts, which check the sha256 of a download and skip one they already have.
  llama:
    runs-on: [self-hosted, agentica-lang]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install the pinned Agentica release
        uses: agentica-lang/setup-agentica@v1
        with:
          version: ${{ env.AGENTICA_VERSION }}
          sha256: ${{ env.AGENTICA_SHA256 }}

      - name: Cache llama.cpp
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .tools/llama.cpp
          key: llama-${{ hashFiles('scripts/fetch-llama.sh') }}

      - name: Cache the model
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .tools/models
          key: model-${{ hashFiles('scripts/fetch-model.sh') }}

      - run: make smoke-llama

      - name: llama-server logs
        if: failure()
        run: tail -n +1 llm/_build/llama-logs/*.log || true
