name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a pull request cancels its older run; a push to main gets a group of its own, so it is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Each job has a GitHub-hosted runner of its own with 4 vCPUs, so each runs four things at once.
  JOBS: 4
  AGENTICA_VERSION: 0.34.0
  AGENTICA_SHA256: d3623164ef097f1cada71749f50440de836f7a943a44336e57ef19b108ae8aa5

jobs:
  # What a pull request changed decides which jobs run: `code` is every file but the user guide and the top-level .md
  # files, `docs` is the user guide and what builds it. A push to main runs every job. A skipped job counts as passed.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ github.event_name != 'pull_request' || steps.filter.outputs.code }}
      docs: ${{ github.event_name != 'pull_request' || steps.filter.outputs.docs }}
    steps:
      - id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          predicate-quantifier: some-with-excludes
          filters: |
            code:
              - '**'
              - '!docs/**'
              - '!*.md'
              - '!.gitmodules'
            docs:
              - 'docs/**'
              - '.gitmodules'
              - 'Makefile'
              - '.github/workflows/ci.yml'

  # The targets of `make test` in three jobs that run at once, each on its own GitHub-hosted runner (ubuntu-24.04: it has
  # the C toolchain for bash's native module and the Python 3 of `make pty`). A job installs the pinned Agentica, and
  # the packages that `make install` fetches are cached by their locks.
  test:
    name: ${{ matrix.name }}
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: core
            run: make fmt-check check unit PACKAGES=core
          - name: packages
            run: make fmt-check check native-check prebuilt-e2e check-library-test unit PACKAGES="sse llm mcp protocol monty bash client cli tui_client"
          - name: pty and smoke
            run: make pty smoke peer
    steps:
      # The submodules: vendor/tree-sitter-bash holds the parser that bash's native module includes.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: true

      - name: Install the pinned Agentica release
        uses: agentica-lang/setup-agentica@2d68f4c3d20ca2c6567bf9dc2378543132f872a8 # v1
        with:
          version: ${{ env.AGENTICA_VERSION }}
          sha256: ${{ env.AGENTICA_SHA256 }}

      # It holds the native module of bash too (native-build/), so its sources are in the key.
      - name: Cache the fetched packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/agentica/pkg
          key: packages-${{ hashFiles('**/agentica.lock', 'bash/native/**', 'bash/agentica.toml') }}

      # The compile cache of each package (_build/, 75 MB for core) is named by the hash of the sources, so a stale file
      # is never used; the last cache of the job and the Agentica version is the start of the next one.
      - name: Cache the compiled packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            */_build
            !*/_build/bin
          key: build-${{ env.AGENTICA_VERSION }}-${{ matrix.name }}-${{ hashFiles('**/*.agc', '!**/deps/**', '!**/_build/**') }}
          restore-keys: |
            build-${{ env.AGENTICA_VERSION }}-${{ matrix.name }}-

      - run: agentica --version

      # make check uses rg (with PCRE2) for the coupling rules of the packages; the hosted image does not have it.
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ripgrep

      - run: ${{ matrix.run }}

      # The cache is saved after the last step: entries that are over a week old are dropped first, so it does not only
      # grow (a file that is still used is compiled again and is new).
      - name: Prune the compile caches
        run: find . -path '*/_build/*' -not -path './*/deps/*' -type f -mtime +7 -delete

  # The user guide: `make docs` with the pinned Hugo and Dart Sass (a warning fails the build).
  docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      HUGO_VERSION: 0.167.0
      HUGO_SHA256: 0163f5c3deddac1f494a1629ddc40c65d18de9d5794facd98f7f96ac2c7d8957
      DART_SASS_VERSION: 1.105.1
      DART_SASS_SHA256: 9046fdd4a31a524a0020298c55d9e155d4c22363ef268e8992574335a72c6a6f
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Install the pinned Hugo and Dart Sass
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSLo hugo.tar.gz "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          echo "${HUGO_SHA256}  hugo.tar.gz" | sha256sum -c
          mkdir -p bin && tar -xzf hugo.tar.gz -C bin hugo
          curl -fsSLo sass.tar.gz "https://github.com/sass/dart-sass/releases/download/${DART_SASS_VERSION}/dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz"
          echo "${DART_SASS_SHA256}  sass.tar.gz" | sha256sum -c
          tar -xzf sass.tar.gz
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/dart-sass" >> "$GITHUB_PATH"
      - run: make docs

  # Each merge to main whose checks passed gets the tag of its version, finn-YYYYMMDDhhmmss: the UTC time of the commit,
  # which bin/finn reports as the version. Only on a push to main, never on a pull request. A tag that exists on this
  # commit is left as it is; one on another commit (two merges in the same second) fails the job. The one job that may
  # write to the repository.
  tag-version:
    name: tag the version
    needs: result
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Tag the commit with its version
        run: |
          tag="finn-$(TZ=UTC0 git log -1 --format=%cd --date=format-local:%Y%m%d%H%M%S "$GITHUB_SHA")"
          if existing=$(git ls-remote --exit-code --tags origin "refs/tags/$tag"); then
            if [ "$(echo "$existing" | cut -f1)" = "$GITHUB_SHA" ]; then
              echo "$tag exists already on $GITHUB_SHA"
              exit 0
            fi
            echo "$tag exists on another commit: $existing" >&2
            exit 1
          fi
          git tag "$tag" "$GITHUB_SHA"
          git push origin "refs/tags/$tag"
          echo "tagged $GITHUB_SHA as $tag"

  # The one check to require: a skipped matrix job reports as `matrix.name`, never as `core`, so a rule that named a
  # matrix job would wait forever on a docs-only pull request. This passes when every job passed or was skipped.
  result:
    needs: [changes, test, docs]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          CHANGES: ${{ needs.changes.result }}
          TEST: ${{ needs.test.result }}
          DOCS: ${{ needs.docs.result }}
        run: |
          echo "changes: $CHANGES, test: $TEST, docs: $DOCS"
          [ "$CHANGES" = success ] && [[ "$TEST" =~ ^(success|skipped)$ ]] && [[ "$DOCS" =~ ^(success|skipped)$ ]]
